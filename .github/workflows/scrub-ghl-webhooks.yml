name: Scrub legacy GHL webhook URLs

on:
  push:
    branches:
      - turnstile-spam-protection
    paths:
      - .github/workflows/scrub-ghl-webhooks.yml

permissions:
  contents: write

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turnstile-spam-protection
          fetch-depth: 0

      - name: Replace public webhook actions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'action="https://services\.leadconnectorhq\.com/hooks/[^"]+/webhook-trigger/[^"]+"')
          changed = []

          for path in Path('src/pages').rglob('*.astro'):
              if path.name == 'probate-help.astro':
                  continue
              text = path.read_text()
              if 'id="lead-capture-form"' not in text:
                  continue
              updated, count = pattern.subn('action="/api/lead"', text)
              if count:
                  path.write_text(updated)
                  changed.append(f'{path}: {count}')

          print('\n'.join(changed) if changed else 'No legacy webhook actions found.')
          PY

      - name: Commit scrubbed forms
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages
          git commit -m "Remove public GHL webhook URLs from protected forms"
          git push origin HEAD:turnstile-spam-protection
