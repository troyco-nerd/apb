name: Validate Turnstile branch

on:
  push:
    branches:
      - turnstile-spam-protection
    paths:
      - .github/workflows/validate-turnstile-branch.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turnstile-spam-protection
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run build
