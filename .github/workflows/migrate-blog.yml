name: Migrate Carrot Blog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - write

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/clone-apb-repo-iJjja

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + Chromium
        run: npx playwright install --with-deps chromium

      - name: Run migration (${{ inputs.mode }})
        run: |
          if [ "${{ inputs.mode }}" = "dry-run" ]; then
            npm run migrate:blog:dry
          else
            npm run migrate:blog:write
          fi

      - name: Upload dry-run report as artifact
        if: inputs.mode == 'dry-run'
        uses: actions/upload-artifact@v4
        with:
          name: carrot-blog-dry-run-report
          path: migration-reports/carrot-blog-dry-run.json
          retention-days: 30

      - name: Commit migrated content
        if: inputs.mode == 'write'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ public/images/blog/ migration-reports/ || true
          git diff --staged --quiet || git commit -m "Migrate Carrot blog posts to src/content/blog"
          git push
